[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prip-backend"
version = "0.1.0"
description = "PRIP Backend - PayPal Revenue Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.28.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.28,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "httpx>=0.28.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools]
py-modules = ["worker"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "models*", "schemas*", "policies*", "services*", "migrations*", "integrations*", "repositories*"]
exclude = ["tests*"]
namespaces = false

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "import-linter>=2.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
