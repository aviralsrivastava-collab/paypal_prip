# Rate limiting zones (evaluated in http context by nginx default.conf inclusion)
limit_req_zone $binary_remote_addr zone=prip_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=prip_sensitive_limit:10m rate=5r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.paypal.com https://www.sandbox.paypal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' http://localhost:8000 https://api-m.sandbox.paypal.com; frame-src https://www.sandbox.paypal.com;" always;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for nginx (exempt from rate limiting)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
    }

    # API health check endpoints (exempt from rate limiting)
    location /api/health/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sensitive API endpoints (strict rate limiting: 5r/s, burst=10 nodelay)
    location ~ ^/api/(checkout|webhooks|corrections)/ {
        limit_req zone=prip_sensitive_limit burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API endpoints (default rate limiting: 20r/s, burst=40 nodelay)
    location /api/ {
        limit_req zone=prip_api_limit burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
