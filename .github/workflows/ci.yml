name: PRIP Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  harness-and-integrity:
    name: Harness & Secret Integrity Check
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Harness Check
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File "scripts/harness-check.ps1"

  backend-quality:
    name: Backend Lint, Types, Architecture & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Backend Linting (Ruff)
        run: |
          ruff check backend

      - name: Backend Type Checking (Mypy)
        run: |
          mypy backend

      - name: Automated Architecture Enforcement (Import Linter)
        run: |
          lint-imports

      - name: Backend Unit & Integration Tests (Pytest)
        run: |
          pytest backend/tests -v

  frontend-quality:
    name: Frontend Lint, Types, Architecture, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies (using package-lock.json)
        run: |
          cd frontend
          npm ci

      - name: Frontend TypeScript Type Checking
        run: |
          cd frontend
          npm run lint

      - name: Automated Architecture Enforcement (Dependency Cruiser)
        run: |
          cd frontend
          npm run lint:arch

      - name: Frontend Unit & Component Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Frontend Production Build (Vite)
        run: |
          cd frontend
          npm run build
